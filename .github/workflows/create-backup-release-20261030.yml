name: Prepare final site backup for download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-backup-release-20261030.yml'
permissions:
  contents: write
jobs:
  backup:
    if: github.event.head_commit.message == 'Create production source backup release 20261030'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned, deployed production website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '29729e26494115c526ddafb760c28628bfd907b1'
          persist-credentials: false
      - name: Build and verify complete backup ZIP
        env:
          BACKUP_COMMIT: '29729e26494115c526ddafb760c28628bfd907b1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BACKUP_COMMIT"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import zipfile

          source_commit = os.environ['BACKUP_COMMIT']
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files = sorted(p for p in files if p)
          required = {'index.html','admin/index.html','api/admin.js','api/news.js',
                      'api/news-page.js','lib/core.js','lib/rich.js','vercel.json',
                      'assets/keyvisual-qhd.mp4','assets/keyvisual-poster.jpg',
                      'assets/brand-author.webp','assets/fonts/KakaoRegular.ttf',
                      'assets/fonts/KakaoBold.ttf'}
          assert required.issubset(files), 'Missing required site components'
          assert len(files) >= 60, f'Unexpectedly few files: {len(files)}'
          video = Path('assets/keyvisual-qhd.mp4').read_bytes()
          assert len(video) == 1545885, 'Video file size mismatch'
          assert hashlib.sha256(video).hexdigest() == 'aa2a0095a41efc5d9535b27b7030426b914ed1ed8edcbba9e9542df1a9023e7a', 'Video content mismatch'
          top = 'jakgastudio_FINAL_2026-10-30'
          target = Path('jakgastudio_FINAL_2026-10-30.zip')
          readme = """# 작가작업실 JEJU - 운영 홈페이지 최종 소스 백업
          
          원본 저장소: jeong1pumho/jakgastudio
          운영 홈페이지: https://www.jakgastudio.com/
          백업 대상 Git 커밋: 29729e26494115c526ddafb760c28628bfd907b1
          
          포함:
          - index.html 및 웹 페이지 전체 소스
          - admin/ NEWS 관리자 페이지
          - api/ 및 lib/ 서버 측 코드
          - assets/ QHD 동영상, 이미지, 로고, 웹폰트
          - vercel.json 설정
          
          주의:
          - Supabase DB 게시물 데이터·관리자 계정·이미지 Storage 원본은
            Git 저장소 밖에 있으며 이 ZIP에 포함되지 않습니다.
          - Vercel 환경변수, API 키, 비밀번호 등 자격증명은 포함되지 않습니다.
          - 사이트를 새 서버에 복원할 때 Supabase 연결과 도메인 설정을
            별도로 구성해야 합니다.
          - 현재 운영 프로젝트를 덮어쓰지 말고 별도 환경에서 복원 테스트하세요.
          """
          manifest = ['SHA256    FILE']
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as out:
              for file in files:
                  data = Path(file).read_bytes()
                  out.writestr(top + '/' + file, data)
                  manifest.append(hashlib.sha256(data).hexdigest() + '  ' + file)
              out.writestr(top + '/BACKUP_README.md', readme)
              out.writestr(top + '/BACKUP_FILE_SHA256.txt', '\n'.join(manifest) + '\n')
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None, 'Zip integrity test failed'
              names = z.namelist()
              assert len(names) == len(files) + 2
              for required_file in required:
                  assert top + '/' + required_file in names
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          Path(str(target)+'.sha256').write_text(digest+'  '+target.name+'\n')
          print('ZIP VERIFIED', 'tracked_files=',len(files),'total_zip_bytes=',target.stat().st_size,'commit=',source_commit,'sha256=',digest)
          PY
      - name: Publish fixed-version backup as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_COMMIT: '29729e26494115c526ddafb760c28628bfd907b1'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.txt <<'NOTE'
          작가작업실 JEJU 운영 홈페이지의 배포 검증 최종 소스 백업입니다.
          고정 Git 커밋: 29729e26494115c526ddafb760c28628bfd907b1
          포함: HTML, NEWS 관리자 및 API, 이미지, 동영상, 폰트, Vercel 설정.
          제외: Supabase 데이터베이스 게시물, 로그인/인증 데이터, Storage 백업, Vercel 비밀 환경변수.
          NOTE
          gh release create 'site-backup-2026-10-30' \
            'jakgastudio_FINAL_2026-10-30.zip' \
            'jakgastudio_FINAL_2026-10-30.zip.sha256' \
            --target "$BACKUP_COMMIT" \
            --title '작가작업실 JEJU 최종 운영 홈페이지 백업 2026-10-30' \
            --notes-file /tmp/release-notes.txt

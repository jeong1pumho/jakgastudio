name: Initial IndexNow submission
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  submit:
    if: github.event.head_commit.message == 'Initialize IndexNow submission for current site'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit current public canonical URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          host = "www.jakgastudio.com"
          root = "https://" + host
          key = "65642d34b176c5ec2dca3f500044a9ee"
          opener = urllib.request.build_opener()
          with opener.open(root + "/" + key + ".txt", timeout=20) as resp:
              assert resp.status == 200 and resp.read().decode().strip() == key, "IndexNow ownership key missing"
          with opener.open(root + "/sitemap.xml", timeout=20) as resp:
              assert resp.status == 200
              sitemap = resp.read()
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [node.text for node in ET.fromstring(sitemap).findall(".//s:loc", ns)]
          urls = list(dict.fromkeys(url for url in locs if url and url.startswith(root + "/")))
          assert urls and len(urls) <= 10000
          assert root + "/programs" not in urls
          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": root + "/" + key + ".txt",
              "urlList": urls
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST")
          try:
              with opener.open(request, timeout=30) as resp:
                  status = resp.status
          except urllib.error.HTTPError as error:
              status = error.code
              print("IndexNow rejected submission:", status, error.read().decode()[:500])
              raise
          assert status in (200, 202), f"Unexpected IndexNow response: {status}"
          print(f"IndexNow accepted {len(urls)} canonical URLs; HTTP {status}")
          PY

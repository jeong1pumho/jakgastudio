name: Promote finalized JEJU temp site to production - one time
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-temp-to-production-20261030.yml']
permissions:
  contents: write
jobs:
  promote:
    if: github.event.head_commit.message == 'Stage one-time temp to production synchronization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: main
      - name: Copy verified test source preserving production-only assets
        shell: bash
        run: |
          set -euo pipefail
          expected_test_sha="e67066fbe081bc49a9d51422e1b65c5b5218bc4a"
          expected_prod_parent="7c45630fe9a57e0995e0a5ddb1c62c2cc802dc2f"
          test "$(git rev-parse HEAD^)" = "$expected_prod_parent" || { echo "Unexpected production base"; exit 1; }
          git clone --depth=1 --branch main https://github.com/jeong1pumho/jakgastudio-temp.git /tmp/jakgastudio-release
          actual_test_sha="$(git -C /tmp/jakgastudio-release rev-parse HEAD)"
          test "$actual_test_sha" = "$expected_test_sha" || { echo "Source was updated; aborting"; exit 1; }
          rsync -a --exclude='.git' --exclude='.github' /tmp/jakgastudio-release/ ./
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          origin='https://jakgastudio-temp.vercel.app/'
          prod='https://www.jakgastudio.com/'
          htmlfile=Path('index.html')
          html=htmlfile.read_text(encoding='utf-8')
          search='<meta content="noindex, nofollow" name="robots"/>'
          assert html.count(search)==1,'Main index robots tag changed'
          html=html.replace(search,'<meta content="index, follow" name="robots"/>')
          assert origin in html,'Expected test SEO origins missing'
          html=html.replace(origin,prod)
          assert 'jakgastudio-temp.vercel.app' not in html,'Test origin retained in main HTML'
          htmlfile.write_text(html,encoding='utf-8')
          newsfile=Path('api/news-page.js')
          news=newsfile.read_text(encoding='utf-8')
          robots_header="  res.setHeader('X-Robots-Tag','noindex, nofollow');\n"
          robots_meta='<meta name="robots" content="noindex,nofollow">'
          assert news.count(robots_header)==1,'NEWS robots header changed'
          assert news.count(robots_meta)==1,'NEWS robots HTML changed'
          news=news.replace(robots_header,'')
          news=news.replace(robots_meta,'<meta name="robots" content="index,follow">')
          newsfile.write_text(news,encoding='utf-8')
          seofile=Path('lib/seo.js')
          seosrc=seofile.read_text(encoding='utf-8')
          old="const TEST_ORIGIN='https://jakgastudio-temp.vercel.app';"
          assert seosrc.count(old)==1,'SEO fallback origin changed'
          seosrc=seosrc.replace(old,"const TEST_ORIGIN='https://www.jakgastudio.com';")
          seofile.write_text(seosrc,encoding='utf-8')
          robotsfile=Path('api/robots.js')
          robotssrc=robotsfile.read_text(encoding='utf-8')
          assert "Disallow: /admin/\\n" in robotssrc,'robots admin policy changed'
          robotssrc=robotssrc.replace("Disallow: /admin/\\n","Disallow: /admin\\n")
          robotsfile.write_text(robotssrc,encoding='utf-8')
          configfile=Path('vercel.json')
          config=json.loads(configfile.read_text(encoding='utf-8'))
          assert len(config.get('headers',[]))==1,'Unexpected headers policy'
          assert config['headers'][0]['source']=='/(.*)'
          assert config['headers'][0]['headers'][0]['key']=='X-Robots-Tag'
          assert config['headers'][0]['headers'][0]['value']=='noindex, nofollow, noarchive'
          config['headers']=[
            {'source':'/admin','headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow'}]},
            {'source':'/admin/(.*)','headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow'}]}
          ]
          configfile.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Verify exact binary contents of all source assets without modifying legacy production files.
          src=Path('/tmp/jakgastudio-release')
          asset_paths=sorted((src/'assets').rglob('*'))
          copied_assets=0
          for item in asset_paths:
            if item.is_file():
              relative=item.relative_to(src)
              copied=Path(relative)
              assert copied.is_file(),f'Missing source asset: {relative}'
              assert item.stat().st_size==copied.stat().st_size, f'Asset size differs: {relative}'
              assert hashlib.sha256(item.read_bytes()).digest()==hashlib.sha256(copied.read_bytes()).digest(),f'Asset differs: {relative}'
              copied_assets+=1
          assert copied_assets==40, f'Unexpected test asset count: {copied_assets}'
          for item in ['assets/fonts/KakaoRegular.ttf','assets/fonts/KakaoBold.ttf','assets/final_books.webp','assets/final_reading.webp','assets/final_writing.webp','assets/final_rental.webp','assets/location_map_preview.webp','assets/favicon.ico']:
            assert Path(item).is_file(), f'Production legacy asset lost: {item}'
          assert html.count('class="kv-mobile-picture"')==7
          assert html.count('class="gallery-photo space-gallery-item')==19
          assert html.count('class="program-row"')==5
          assert html.count('instagram.com/jakgastudio')>=1
          assert html.count('instagram.com/pobisiyul')>=1
          assert html.count('threads.com/@jakgamanager')>=1
          m=re.search(r'<script type="application/ld\+json">(.+?)</script>',html,re.S)
          assert m
          schema=json.loads(m.group(1))
          assert len(schema['@graph'])==5
          assert all(prod in obj.get('@id','') for obj in schema['@graph'])
          assert any(t['source']=='/sitemap.xml' for t in config['rewrites'])
          assert any(t['source']=='/robots.txt' for t in config['rewrites'])
          assert 'noindex' not in news, 'NEWS should be indexable'
          assert 'noindex' not in html, 'Homepage should be indexable'
          assert config['headers'][0]['source']!="/(.*)", 'Global crawl block must be removed'
          refs=set(re.findall(r'(?:src|href)=["\']/assets/([^"\']+)',html))
          refs.update(re.findall(r'url\([\"\']?/assets/([^\"\')]+)',html))
          missing=[ref for ref in refs if not (Path('assets')/ref).is_file()]
          assert not missing, f'Missing local image references: {missing}'
          assert 'api/news.js' in [str(x.relative_to(Path('.'))) for x in Path('api').rglob('*.js')]
          print('PROMOTION SOURCE VALIDATION OK',{'copied_test_assets':copied_assets,'local_image_refs':len(refs),'seo_origin':prod})
          PY
          for file in api/*.js lib/*.js; do node --check "$file"; done
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish finalized temp site to www.jakgastudio.com with production SEO enabled"
          git push origin HEAD:main
